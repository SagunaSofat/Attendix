<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Attendix - Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/login.css">
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;

            background-color: white;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #243b64;
        }


        /* ================= LOGIN CONTAINER ================= */

        .login-container {
            width: 400px;

            padding: 40px;

            background-color: white;

            border: 1px solid #dce3eb;

            border-radius: 12px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);

            text-align: center;
        }


        /* ================= LOGO ================= */

        .logo-symbol {
            width: 55px;
            height: 55px;

            margin: 0 auto 12px;

            background-color: #315f9e;

            color: white;

            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 28px;
            font-weight: bold;
        }

        .login-container h1 {
            font-family: 'Outfit', sans-serif;

            font-size: 28px;

            margin-bottom: 5px;

            color: #243b64;
        }

        .login-container .subtitle {
            color: #777;

            font-size: 13px;

            margin-bottom: 30px;
        }


        /* ================= FORM ================= */

        .form-group {
            text-align: left;

            margin-bottom: 18px;
        }

        .form-group label {
            display: block;

            font-size: 13px;

            font-weight: 600;

            color: #333;

            margin-bottom: 7px;
        }

        .form-group input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccd5e0;

            border-radius: 6px;

            font-family: 'Poppins', sans-serif;

            font-size: 13px;

            outline: none;
        }

        .form-group input:focus {
            border-color: #315f9e;
        }


        /* ================= OPTIONS ================= */

        .options {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 22px;

            font-size: 11px;
        }

        .remember {
            display: flex;

            align-items: center;

            gap: 5px;

            color: #666;
        }

        .forgot {
            color: #315f9e;

            text-decoration: none;
        }

        .forgot:hover {
            text-decoration: underline;
        }


        /* ================= LOGIN BUTTON ================= */

        .login-submit {
            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 6px;

            background-color: #315f9e;

            color: white;

            font-family: 'Poppins', sans-serif;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;
        }

        .login-submit:hover {
            background-color: #243b64;
        }


        /* ================= SIGN UP ================= */

        .signup {
            margin-top: 25px;

            color: #777;

            font-size: 12px;
        }

        .signup a {
            color: #315f9e;

            text-decoration: none;

            font-weight: 600;
        }


        /* ================= BACK BUTTON ================= */

        .back {
            display: inline-block;

            margin-top: 20px;

            color: #555;

            text-decoration: none;

            font-size: 12px;
        }

        .back:hover {
            color: #315f9e;
        }


        /* ================= MOBILE ================= */

        @media (max-width: 500px) {

            .login-container {
                width: 90%;

                padding: 30px 25px;
            }

        }

    </style>

</head>


<body>

    <div class="login-container">

        <div class="logo-symbol">
            ✓
        </div>

        <h1>Welcome to Attendix</h1>

        <p class="subtitle">
            Login to manage your attendance
        </p>


        <form>

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <div class="options">

                <label class="remember">

                    <input type="checkbox">

                    Remember me

                </label>

                <a href="#" class="forgot">
                    Forgot Password?
                </a>

            </div>


            <a href="dashboard.html" class="login-submit">
               Login
            </a>

        </form>


        <p class="signup">

            Don't have an account?

            <a href="#">
                Create Account
            </a>

        </p>


        <a href="website.html" class="back">
            ← Back to Home
        </a>

    </div>
    <script src="../JS/app.js" defer></script>
</body>

</html>
